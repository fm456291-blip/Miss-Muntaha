<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Letter For Miss Muntaha ❤️</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>
    


    <!-- Floating Hearts -->
    <div id="hearts"></div>
    <audio id="birthdayMusic" loop>

    <source
        src="../assets/music/Piano.mp3"
        type="audio/mpeg">

</audio>


    <!-- Main Hero -->
    <main class="hero">

        <div class="glass-card">

            <p class="eyebrow">
                ✨ A Little Something For You ✨
            </p>

            <h1>
                Miss Muntaha
                <span>❤️</span>
            </h1>

            <p class="hero-text">
                For the person who makes every problem
                feel a little smaller...
            </p>

            <p class="small-text">
                Some people enter your life quietly,
                and somehow become very special.
            </p>

            <button id="startBtn">
                💌 Begin This Little Journey
            </button>

        </div>

    </main>

    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
